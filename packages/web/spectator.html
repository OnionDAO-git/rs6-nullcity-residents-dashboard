<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NullCity Spectator</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050403;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        background: #000;
        image-rendering: auto;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 8px;
        border: 1px solid rgba(228, 184, 64, 0.34);
        background: rgba(5, 4, 3, 0.82);
        color: #d8c8a4;
        font: 12px monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="765" height="503"></canvas>
    <div id="status">waiting for spectator packets</div>
    <script type="module" src="/src/spectator.ts"></script>
  </body>
</html>
